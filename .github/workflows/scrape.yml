name: Monitor B&H SLC10220CPGV22 Price Drop & Price Match

on:
  schedule:
    # Check B&H Photo + authorized US competitors every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      test_ntfy:
        description: "Send a test ntfy push notification"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-deals
  cancel-in-progress: true

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scrapers
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_INTERVAL_HOURS: ${{ vars.SERPAPI_INTERVAL_HOURS }}
          FORCE_SERPAPI: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/scrape_all.py

      - name: Check watchlist & send email/ntfy alerts
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NTFY: ${{ github.event.inputs.test_ntfy || '0' }}
        run: python scripts/notify.py

      - name: Commit updated deal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/deals.json data/history.json data/notified.json data/serpapi_state.json || true
          git diff --staged --quiet || git commit -m "chore: update gaming PC deals [skip ci]"
          git push origin HEAD:main
