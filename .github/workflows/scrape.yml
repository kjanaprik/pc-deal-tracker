name: Scrape Gaming PC Deals & Notify

on:
  schedule:
    # Regular schedule: every 2 hours
    - cron: "0 */2 * * *"
    # Black Friday / Cyber Monday weekend burst: every 30 minutes (Nov 26-30)
    - cron: "*/30 * 26-30 11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python venv & dependencies
        run: |
          if [ ! -d ".venv" ]; then python3 -m venv .venv; fi
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium

      - name: Run scrapers
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: .venv/bin/python scripts/scrape_all.py

      - name: Check watchlist & send email alerts
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: .venv/bin/python scripts/notify.py

      - name: Commit updated deal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/history.json data/notified.json || true
          git diff --staged --quiet || git commit -m "chore: update gaming PC deals [skip ci]"
          git push
