name: Scrape Gaming PC Deals & Notify (24/7 Cloud)

on:
  schedule:
    # Regular schedule: every 2 hours (24/7 on GitHub Cloud)
    - cron: "0 */2 * * *"
    # Black Friday / Cyber Monday weekend burst: every 30 minutes (Nov 26-30)
    - cron: "*/30 * 26-30 11 *"
  workflow_dispatch:
    inputs:
      test_ntfy:
        description: "Send a test ntfy push notification"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-deals
  cancel-in-progress: true

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scrapers
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          RAINFOREST_API_KEY: ${{ secrets.RAINFOREST_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/scrape_all.py

      - name: Check watchlist & send email/ntfy alerts
        env:
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NTFY: ${{ github.event.inputs.test_ntfy || '0' }}
        run: python scripts/notify.py

      - name: Commit updated deal data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/history.json data/notified.json || true
          git diff --staged --quiet || git commit -m "chore: update gaming PC deals [skip ci]"
          git pull --rebase || true
          git push
